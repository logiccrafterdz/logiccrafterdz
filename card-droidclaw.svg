<svg width="400" height="130" viewBox="0 0 400 130" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .border-rare-alt { fill: #ff5400; }
    .border-rare-alt-inner { fill: #ff0054; }
    .text-title { font-family: 'Consolas', 'Courier New', monospace; font-size: 16px; font-weight: bold; fill: #ff5400; text-transform: uppercase; }
    .text-desc { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #c9d1d9; }
    .text-tier { font-family: 'Consolas', 'Courier New', monospace; font-size: 10px; font-weight: bold; fill: #0d1117; }
    .text-stats { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: bold; fill: #ff0054; }
    .pixel { shape-rendering: crispEdges; }
    
    /* Neon glow effect for title */
    .glow { filter: drop-shadow(0 0 4px #ff5400); }
  </style>

  <!-- Background -->
  <rect class="bg pixel" width="400" height="130" />

  <!-- Outer Pixel Border (Rare Alt Orange) -->
  <path class="border-rare-alt pixel" d="
    M 4 0 H 396 V 4 H 400 V 126 H 396 V 130 H 4 V 126 H 0 V 4 H 4 Z
  " fill-opacity="0.8"/>
  
  <!-- Inner Pixel Border (Rare Alt Red) -->
  <path class="border-rare-alt-inner pixel" d="
    M 6 2 H 394 V 4 H 396 V 126 H 394 V 128 H 6 V 126 H 4 V 4 H 6 Z
  " fill-opacity="0.4"/>
  
  <!-- Card Background -->
  <path class="bg pixel" d="
    M 6 4 H 394 V 126 H 6 Z
  "/>

  <!-- Pixel Art Claw Icon (16x16 scaled up) -->
  <g transform="translate(15, 15) scale(2)" class="pixel">
    <rect x="0" y="0" width="2" height="6" fill="#ff5400"/>
    <rect x="3" y="1" width="2" height="5" fill="#ff5400"/>
    <rect x="6" y="0" width="2" height="6" fill="#ff5400"/>
    <rect x="1" y="6" width="6" height="2" fill="#ff5400"/>
  </g>

  <!-- Title -->
  <text x="40" y="27" class="text-title glow">DROIDCLAW</text>

  <!-- Description -->
  <text x="15" y="55" class="text-desc">An advanced automation and</text>
  <text x="15" y="70" class="text-desc">integration framework for</text>
  <text x="15" y="85" class="text-desc">distributed systems.</text>

  <!-- Language Dot (Go - Cyan) -->
  <rect x="15" y="105" width="8" height="8" fill="#00ADD8" class="pixel"/>
  <text x="28" y="113" class="text-desc">Go</text>

  <!-- Star Icon (Pixel Art) -->
  <g transform="translate(80, 104)" class="pixel border-rare-alt-inner">
    <path d="M4 0h1v3h3v1H5v3H4V4H1V3h3V0z" fill="#ff0054"/>
  </g>
  <text x="92" y="113" class="text-stats">4</text>

  <!-- Rarity Tier Badge -->
  <g transform="translate(300, 102)" class="pixel">
    <rect x="0" y="0" width="85" height="15" fill="#ff5400" />
    <text x="42.5" y="11" class="text-tier" text-anchor="middle">RARE</text>
  </g>

</svg>
