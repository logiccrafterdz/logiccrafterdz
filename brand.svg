<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <style>
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 700;
      font-size: 32px;
      fill: #ffffff;
      letter-spacing: 4px;
    }
    .subtitle {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #8b949e;
      letter-spacing: 4px;
    }
    .grid-line {
      stroke: #21262d;
      stroke-width: 1;
      stroke-opacity: 0.4;
    }
    .accent-dot {
      fill: #7b2cbf;
    }
    .glow-path {
      stroke: url(#gradient);
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
      stroke-opacity: 0.8;
    }
  </style>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
  </defs>

  <!-- Background Subtle Grid -->
  <line x1="0" y1="20" x2="800" y2="20" class="grid-line" />
  <line x1="0" y1="60" x2="800" y2="60" class="grid-line" />
  <line x1="0" y1="100" x2="800" y2="100" class="grid-line" />
  <line x1="150" y1="0" x2="150" y2="120" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="120" class="grid-line" />
  <line x1="450" y1="0" x2="450" y2="120" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="120" class="grid-line" />

  <!-- Abstract Systems / Circuit Path -->
  <path d="M 50,60 L 150,60 L 200,20 L 350,20 L 400,100 L 550,100 L 600,60 L 750,60" class="glow-path" />

  <!-- Intersection Dots -->
  <circle cx="150" cy="60" r="3" class="accent-dot" />
  <circle cx="200" cy="20" r="3" class="accent-dot" />
  <circle cx="350" cy="20" r="3" class="accent-dot" />
  <circle cx="400" cy="100" r="3" class="accent-dot" />
  <circle cx="550" cy="100" r="3" class="accent-dot" />
  <circle cx="600" cy="60" r="3" class="accent-dot" />

  <!-- Typography -->
  <text x="50%" y="55" dominant-baseline="middle" text-anchor="middle" class="title">LOGIC<tspan fill="#7b2cbf">CRAFTER</tspan></text>
  <text x="50%" y="85" dominant-baseline="middle" text-anchor="middle" class="subtitle">PRECISION • PERFORMANCE • PROTOCOL</text>
</svg>
