<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%">
  <rect width="800" height="160" fill="#0b1220" rx="8" />
  
  <style>
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 700;
      font-size: 36px;
      fill: #ffffff;
      letter-spacing: 5px;
    }
    .subtitle {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #14b8a6;
      letter-spacing: 6px;
    }
    .monogram-bg {
      fill: #111e38;
      stroke: #1e293b;
      stroke-width: 1.5;
    }
    .monogram-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 40px;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-opacity: 0.6;
    }
    .accent-dot {
      fill: #14b8a6;
    }
    .glow-path {
      stroke: url(#gradient);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
  </style>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Subtle Grid on the Right -->
  <line x1="500" y1="0" x2="500" y2="160" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="160" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="160" class="grid-line" />
  <line x1="450" y1="40" x2="800" y2="40" class="grid-line" />
  <line x1="450" y1="80" x2="800" y2="80" class="grid-line" />
  <line x1="450" y1="120" x2="800" y2="120" class="grid-line" />

  <!-- Grid nodes and paths -->
  <path d="M 480,80 L 500,80 L 540,40 L 600,40 L 640,120 L 700,120 L 740,80 L 780,80" class="glow-path" />

  <circle cx="500" cy="80" r="3.5" class="accent-dot" />
  <circle cx="540" cy="40" r="3.5" class="accent-dot" />
  <circle cx="600" cy="40" r="3.5" class="accent-dot" />
  <circle cx="640" cy="120" r="3.5" class="accent-dot" />
  <circle cx="700" cy="120" r="3.5" class="accent-dot" />
  <circle cx="740" cy="80" r="3.5" class="accent-dot" />

  <!-- Monogram Box (Left) -->
  <rect x="50" y="40" width="80" height="80" rx="12" class="monogram-bg" />
  <text x="90" y="82" dominant-baseline="middle" text-anchor="middle" class="monogram-text">LC</text>

  <!-- Typography -->
  <text x="160" y="75" class="title">LOGIC<tspan fill="#14b8a6">CRAFTER</tspan></text>
  <text x="162" y="105" class="subtitle">PROTOCOLS • QUANT • AI</text>
</svg>
