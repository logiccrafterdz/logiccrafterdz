<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420">
  <rect width="1400" height="420" fill="#0B1220" rx="16" />
  
  <style>
    @keyframes pulse {
      0% {
        stroke-dashoffset: 1400;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }
    @keyframes fade {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 700;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: 8px;
    }
    .subtitle {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: #14B8A6;
      letter-spacing: 10px;
    }
    .monogram-bg {
      fill: #111827;
      stroke: #1e293b;
      stroke-width: 2;
    }
    .monogram-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 56px;
      fill: #38BDF8;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-opacity: 0.4;
    }
    .accent-dot {
      fill: #14B8A6;
      animation: fade 4s ease-in-out infinite;
    }
    .dot-1 { animation-delay: 0s; }
    .dot-2 { animation-delay: 0.8s; }
    .dot-3 { animation-delay: 1.6s; }
    .dot-4 { animation-delay: 2.4s; }
    
    .glow-path {
      stroke: url(#gradient);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 300 900;
      animation: pulse 12s linear infinite;
    }
  </style>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <line x1="200" y1="0" x2="200" y2="420" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="420" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="420" class="grid-line" />
  <line x1="1000" y1="0" x2="1000" y2="420" class="grid-line" />
  <line x1="1200" y1="0" x2="1200" y2="420" class="grid-line" />
  
  <line x1="0" y1="100" x2="1400" y2="100" class="grid-line" />
  <line x1="0" y1="210" x2="1400" y2="210" class="grid-line" />
  <line x1="0" y1="320" x2="1400" y2="320" class="grid-line" />

  <!-- Symmetrical Glow Paths -->
  <path d="M 100,210 L 200,210 L 400,100 L 600,100" class="glow-path" />
  <path d="M 800,320 L 1000,320 L 1200,210 L 1300,210" class="glow-path" />

  <!-- Dots -->
  <circle cx="200" cy="210" r="4.5" class="accent-dot dot-1" />
  <circle cx="400" cy="100" r="4.5" class="accent-dot dot-2" />
  <circle cx="1000" cy="320" r="4.5" class="accent-dot dot-3" />
  <circle cx="1200" cy="210" r="4.5" class="accent-dot dot-4" />

  <!-- Monogram Box (Center) -->
  <rect x="640" y="55" width="120" height="120" rx="20" class="monogram-bg" />
  <text x="700" y="120" dominant-baseline="middle" text-anchor="middle" class="monogram-text">LC</text>

  <!-- Typography (Center) -->
  <text x="700" y="240" text-anchor="middle" class="title">LOGIC<tspan fill="#14B8A6">CRAFTERDZ</tspan></text>
  <text x="700" y="295" text-anchor="middle" class="subtitle">PROTOCOLS • QUANT • AI</text>
</svg>
